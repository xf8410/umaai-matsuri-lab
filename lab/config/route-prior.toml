# 轮次 7 冠军档：GA 权重冠军（ga-best.toml）+ 离线搜索蒸馏出的教诲路线先验。
# `route = 500.0` 打开 `ROUTE_PRIOR`（value.rs，禁忌搜索在留出集 61900–61999 上找到的路线）：
#   命中一格 +500 分，足以压过其它打分项，等价于外部 `MATSURI_ASSIGN_PIN` 钉位。
#   实测：route ∈ {200, 500, 2000, 1e5} 与外部钉位 100 局均分逐位相同（73810.9）。
# `status_limit`/`assist` 是两个「打分表原本没算」的效果项，实测都不是增益来源
#   （status_limit +306 t=0.76 噪声；assist −563 t=−3.23 显著有害），故锁 0。
