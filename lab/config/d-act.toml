# 实验室覆盖层 · 动态权重变体 d-act
# 单变量实验：在 w-uniform（当前最优，100 局均分 64509.8）之上只开一个动态旋钮。
# 演目 Lv 追赶 act_catchup=0.5
# 实测 100 局演目 Lv 收尾是 10/10/10/8~9/8~9 —— 演目3(根)/演目4(智) 长期落后，
# 而根+智 恰好占满五维可得分余量的 11366/14394。给落后的演目升级加权。
# 全部动态旋钮默认 0 = 关闭；这里只开一个，便于归因。

[fusion] 列表整段替换；[trainer] 给了就整段替换（不按字段合并）。
#   所以本文件必须给全 trainer 的每一个键。

[fusion]
year2 = [{ base = 101, target = 601 }, { base = 201, target = 701 }]
year3 = [
    { base = 501, target = 801 },
    { base = 301, target = 901 },
    { base = 401, target = 1001 },
]

[trainer]
pt_favor_rate = 2.2
