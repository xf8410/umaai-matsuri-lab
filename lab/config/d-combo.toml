# 实验室覆盖层 · 动态权重组合档 d-combo
# 单变量实测（100 局 CRN 配对，基线 w-uniform 64509.8）：
#   status_catchup=1.0        +1539.8  t=+4.49  ← 唯一显著
#   keiko_tempo=1.0            +193.5  t=+0.63  ← 噪声级
#   act_catchup=0.5            +129.1  t=+0.56  ← 噪声级
#   vital_decay/idle 0.5/1.0   -528.0  t=-1.44  ← 亏，关掉
# 这一份把两个噪声级旋钮叠在赢家上，看是不是「单独不显著但互补」。
# 体力那两个确定是亏的，保持 0。

