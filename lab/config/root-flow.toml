rest_vital = 64
checkpoint_margin = 5
act_level_target = 9
self_race = true
friend_outing_early = true
status_halve_threshold = 1200
status_halve_factor = 0.5
friend_outing_deadline = 0
friend_outing_urgency = 0.0
level_step_bonus = 0.0
# ── 本档新增（卡根流派）──
root_level_cap = 5
root_level_cap_until = 48
root_train_min_heads = 5
outing_avoid_root = true
self_race_from_turn = 66
status_weights = [0.6465, 0.9881, 0.8387, 0.3000, 2.6217]

